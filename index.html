<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تولدت مبارک</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:40px;
    padding:48px 20px;
    background:#faf7f5;
    color:#2b2b2b;
    font-family:"Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:34px;
  }

  .hint{
    font:inherit;
    font-size:14px;
    color:#4a4a4a;
    background:#fff;
    border:1px solid #e7dfda;
    border-radius:999px;
    padding:11px 26px;
    cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
    transition:opacity .45s ease,transform .45s ease,box-shadow .25s ease;
  }
  .hint:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.07)}
  .hint.gone{opacity:0;transform:translateY(-8px);pointer-events:none}

  .cake{
    position:relative;
    width:240px;
    height:180px;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    transition:transform .3s ease;
  }
  .cake:hover{transform:translateY(-2px)}

  .plate{
    position:absolute;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:232px;
    height:18px;
    border-radius:50%;
    background:#ece5e0;
  }

  .body{
    position:absolute;
    left:50%;
    bottom:16px;
    transform:translateX(-50%);
    width:180px;
    height:100px;
    border-radius:16px 16px 10px 10px;
    background:linear-gradient(180deg,#fbd0dc,#efa1b9);
  }

  .frosting{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:30px;
    background:#fff8fa;
    border-radius:16px 16px 0 0;
  }
  .frosting::after{
    content:"";
    position:absolute;
    top:22px;
    left:0;
    right:0;
    height:18px;
    background-image:radial-gradient(circle at 12px 0,#fff8fa 11px,transparent 11.5px);
    background-size:24px 18px;
    background-repeat:repeat-x;
  }

  .candle{
    position:absolute;
    left:50%;
    bottom:116px;
    transform:translateX(-50%);
    width:9px;
    height:40px;
    border-radius:4px;
    background:linear-gradient(90deg,#ffd9e4,#ffa9c4 55%,#f690b1);
    box-shadow:inset -1px 0 0 rgba(0,0,0,.06);
  }

  .flame{
    position:absolute;
    left:50%;
    top:-17px;
    width:13px;
    height:18px;
    margin-left:-6.5px;
    border-radius:50% 50% 50% 50% / 62% 62% 40% 40%;
    background:radial-gradient(circle at 50% 70%,#fff6c2,#ffc24a 60%,#ff8b21);
    box-shadow:0 0 14px rgba(255,170,60,.55);
    transform-origin:50% 100%;
    animation:flicker 1.6s ease-in-out infinite;
    transition:opacity .4s ease,transform .4s ease;
  }

  @keyframes flicker{
    0%,100%{transform:scale(1) rotate(0)}
    50%{transform:scale(1.08) rotate(-3deg)}
  }

  .cake.cut{animation:shake .5s ease}
  .cake.cut .flame{animation:none;opacity:0;transform:scale(.3) translateY(8px)}

  @keyframes shake{
    0%,100%{transform:translateX(0) rotate(0)}
    20%{transform:translateX(-7px) rotate(-2deg)}
    40%{transform:translateX(7px) rotate(2deg)}
    60%{transform:translateX(-4px) rotate(-1deg)}
    80%{transform:translateX(4px) rotate(1deg)}
  }

  .result{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:28px;
  }
  .result.show{display:flex}

  .result h1{
    font-size:clamp(26px,6vw,38px);
    font-weight:600;
    letter-spacing:-.5px;
    color:#33302e;
    animation:rise .9s ease both;
  }

  .result img{
    display:block;
    width:min(340px,82vw);
    height:auto;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:18px;
    background:#f1ebe7;
    box-shadow:0 14px 40px rgba(0,0,0,.09);
    animation:rise 1s .25s ease both;
  }

  @keyframes rise{
    from{opacity:0;transform:translateY(18px)}
    to{opacity:1;transform:translateY(0)}
  }
</style>
</head>
<body>

  <div class="stage">
    <button class="hint" type="button">رو کیک بزنین</button>

    <div class="cake" id="cake">
      <div class="plate"></div>
      <div class="body">
        <div class="frosting"></div>
      </div>
      <div class="candle">
        <div class="flame"></div>
      </div>
    </div>
  </div>

  <div class="result" id="result">
    <h1>تولدت زندایی برزی مبارک</h1>
    <img src="eee.img" alt="تولدت مبارک" width="1080" height="1080">
  </div>

<script>
  const cake = document.getElementById('cake');
  const hint = document.querySelector('.hint');
  const result = document.getElementById('result');
  let opened = false;

  function open() {
    if (opened) return;
    opened = true;
    cake.classList.add('cut');
    hint.classList.add('gone');
    setTimeout(() => result.classList.add('show'), 650);
  }

  hint.addEventListener('click', open);
  cake.addEventListener('click', open);
</script>

</body>
</html>
